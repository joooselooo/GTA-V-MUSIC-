          cat > app/src/main/java/com/example/gtamusic/RoiOverlayView.kt <<'EOF'
          package com.example.gtamusic

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.util.AttributeSet
          import android.view.View

          /** Dibuja el rectángulo verde (ROI) encima de la vista previa de la cámara. */
          class RoiOverlayView(context: Context, attrs: AttributeSet?) : View(context, attrs) {

              private val paint = Paint().apply {
                  color = Color.GREEN
                  style = Paint.Style.STROKE
                  strokeWidth = 5f
              }
              private var rx = 0.7f
              private var ry = 0.7f
              private var rw = 0.25f
              private var rh = 0.25f

              fun setRoi(x: Float, y: Float, w: Float, h: Float) {
                  rx = x; ry = y; rw = w; rh = h
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val l = rx * width
                  val t = ry * height
                  canvas.drawRect(l, t, minOf(width.toFloat(), l + rw * width), minOf(height.toFloat(), t + rh * height), paint)
              }
          }
          EOF
          cat > app/src/main/java/com/example/gtamusic/Detector.kt <<'EOF'
          package com.example.gtamusic

          import android.content.Context
          import android.media.AudioManager
          import android.view.KeyEvent
          import androidx.camera.core.ImageProxy
          import java.util.concurrent.CopyOnWriteArrayList
          import kotlin.math.abs

          /** Lógica de detección: capturas, comparación y envío de play/pausa a Spotify. */
          class Detector(private val ctx: Context) {

              companion object {
                  const val GRID = 8
                  const val FEATURES = GRID * GRID * 3
                  const val REC_MS = 10_000L
                  const val MAX_SAMPLES = 150
                  const val MIN_SAMPLES = 10
                  const val CONFIRM_FRAMES = 4
              }

              private val prefs = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)

              @Volatile var roi = floatArrayOf(0.05f, 0.70f, 0.25f, 0.25f)
              val samplesIn = CopyOnWriteArrayList<FloatArray>()
              val samplesOut = CopyOnWriteArrayList<FloatArray>()

              @Volatile var enabled = false
                  private set
              @Volatile private var recTarget = 0
              @Volatile private var recUntil = 0L
              private var inside = false
              private var agree = 0
              private var lastAnalysis = 0L

              @Volatile var onStatus: ((String) -> Unit)? = null
              @Volatile var onInside: ((Boolean) -> Unit)? = null

              // ---------- Configuración ----------
              fun load() {
                  val r = roi.copyOf()
                  for (k in 0..3) r[k] = prefs.getFloat("roi$k", r[k])
                  roi = r
                  samplesIn.clear()
                  samplesOut.clear()
                  samplesIn.addAll(decode(prefs.getString("samplesIn", null)))
                  samplesOut.addAll(decode(prefs.getString("samplesOut", null)))
                  enabled = prefs.getBoolean("enabled", false)
              }

              fun setEnabled(value: Boolean) {
                  enabled = value
                  inside = false
                  agree = 0
                  prefs.edit().putBoolean("enabled", value).apply()
              }

              fun hasEnoughSamples(): Boolean =
                  samplesIn.size >= MIN_SAMPLES && samplesOut.size >= MIN_SAMPLES

              fun setRoiValue(idx: Int, value: Float) {
                  val r = roi.copyOf()
                  r[idx] = value
                  roi = r
                  prefs.edit().putFloat("roi$idx", value).apply()
                  clearSamples() // al mover el rectángulo hay que volver a grabar
              }

              fun clearSamples() {
                  recTarget = 0
                  samplesIn.clear()
                  samplesOut.clear()
                  saveSamples()
                  setEnabled(false)
              }

              fun startRecording(target: Int) {
                  recUntil = System.currentTimeMillis() + REC_MS
                  recTarget = target
              }

              fun calibStatus(): String =
                  "Capturas → FUERA: ${samplesOut.size}   DENTRO: ${samplesIn.size}" +
                      "\n(mínimo $MIN_SAMPLES de cada una; mejor 60 o más)"

              // ---------- Análisis ----------
              fun process(image: ImageProxy) {
                  try {
                      val now = System.currentTimeMillis()
                      if (now - lastAnalysis < 200) return // ~5 análisis por segundo
                      lastAnalysis = now
                      handleFeatures(extractFeatures(image))
                  } catch (e: Exception) {
                      // ignorar un cuadro defectuoso
                  } finally {
                      image.close()
                  }
              }

              private fun extractFeatures(img: ImageProxy): FloatArray {
                  val r = roi
                  val yP = img.planes[0]
                  val uP = img.planes[1]
                  val vP = img.planes[2]
                  val yB = yP.buffer
                  val uB = uP.buffer
                  val vB = vP.buffer
                  val w = img.width
                  val h = img.height
                  val rot = img.imageInfo.rotationDegrees
                  val out = FloatArray(FEATURES)
                  var i = 0
                  for (gy in 0 until GRID) for (gx in 0 until GRID) {
                      var sy = 0f; var su = 0f; var sv = 0f
                      for (sub in 0 until 4) {
                          val ox = if (sub % 2 == 0) 0.25f else 0.75f
                          val oy = if (sub < 2) 0.25f else 0.75f
                          val dx = r[0] + r[2] * ((gx + ox) / GRID)
                          val dy = r[1] + r[3] * ((gy + oy) / GRID)
                          val fx: Float
                          val fy: Float
                          when (rot) {
                              90 -> { fx = dy; fy = 1f - dx }
                              180 -> { fx = 1f - dx; fy = 1f - dy }
                              270 -> { fx = 1f - dy; fy = dx }
                              else -> { fx = dx; fy = dy }
                          }
                          val px = (fx * (w - 1)).toInt().coerceIn(0, w - 1)
                          val py = (fy * (h - 1)).toInt().coerceIn(0, h - 1)
                          sy += (yB.get(py * yP.rowStride + px * yP.pixelStride).toInt() and 0xFF)
                          val cx = px / 2
                          val cy = py / 2
                          su += (uB.get(cy * uP.rowStride + cx * uP.pixelStride).toInt() and 0xFF)
                          sv += (vB.get(cy * vP.rowStride + cx * vP.pixelStride).toInt() and 0xFF)
                      }
                      out[i++] = sy / 4f
                      out[i++] = su / 4f
                      out[i++] = sv / 4f
                  }
                  return out
              }

              private fun dist(a: FloatArray, b: FloatArray): Float {
                  var s = 0f
                  for (k in a.indices) s += abs(a[k] - b[k])
                  return s / a.size
              }

              /** Distancia a una clase: promedio de las 3 capturas más parecidas. */
              private fun classDist(f: FloatArray, list: List<FloatArray>): Float {
                  val ds = FloatArray(list.size) { dist(f, list[it]) }
                  ds.sort()
                  val k = minOf(3, ds.size)
                  var s = 0f
                  for (i in 0 until k) s += ds[i]
                  return s / k
              }

              private fun handleFeatures(f: FloatArray) {
                  val target = recTarget
                  if (target != 0) {
                      val list = if (target == 1) samplesOut else samplesIn
                      list.add(f)
                      while (list.size > MAX_SAMPLES) list.removeAt(0)
                      val left = ((recUntil - System.currentTimeMillis()) / 1000).toInt()
                      if (left < 0) {
                          recTarget = 0
                          saveSamples()
                          onStatus?.invoke("Grabación lista\n" + calibStatus())
                      } else {
                          onStatus?.invoke(
                              "Grabando ${if (target == 1) "FUERA" else "DENTRO"}… ${left + 1} s\n" + calibStatus()
                          )
                      }
                      return
                  }

                  val snapIn = samplesIn.toList()
                  val snapOut = samplesOut.toList()
                  if (snapIn.size < MIN_SAMPLES || snapOut.size < MIN_SAMPLES) return

                  val dIn = classDist(f, snapIn)
                  val dOut = classDist(f, snapOut)
                  val score = dOut / (dOut + dIn + 0.0001f) // 1.0 = idéntico a "dentro"

                  val wantInside = when {
                      score > 0.55f -> true
                      score < 0.45f -> false
                      else -> inside
                  }
                  if (wantInside != inside) {
                      agree++
                      if (agree >= CONFIRM_FRAMES) {
                          inside = wantInside
                          agree = 0
                          onInside?.invoke(inside)
                          if (enabled) {
                              sendMediaKey(
                                  if (inside) KeyEvent.KEYCODE_MEDIA_PLAY else KeyEvent.KEYCODE_MEDIA_PAUSE
                              )
                          }
                      }
                  } else {
                      agree = 0
                  }

                  val pct = (score * 100).toInt()
                  onStatus?.invoke(
                      (if (inside) "DENTRO del auto" else "FUERA del auto") +
                          "\nParecido a 'dentro': $pct%\n" + calibStatus() +
                          (if (enabled) "" else "\n(Control de Spotify desactivado)")
                  )
              }

              private fun sendMediaKey(code: Int) {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
              }

              // ---------- Guardado ----------
              private fun encode(list: List<FloatArray>): String =
                  list.joinToString(";") { a -> a.joinToString(",") { it.toInt().toString() } }

              private fun decode(s: String?): List<FloatArray> {
                  if (s.isNullOrEmpty()) return emptyList()
                  return try {
                      s.split(";").map { p -> p.split(",").map { it.toFloat() }.toFloatArray() }
                          .filter { it.size == FEATURES }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun saveSamples() {
                  try {
                      prefs.edit()
                          .putString("samplesIn", encode(samplesIn.toList()))
                          .putString("samplesOut", encode(samplesOut.toList()))
                          .apply()
                  } catch (e: Exception) {
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/example/gtamusic/DetectorService.kt <<'EOF'
          package com.example.gtamusic

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Binder
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.view.Surface
          import androidx.camera.core.AspectRatio
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.LifecycleService
          import java.util.concurrent.Executors

          /** Servicio en primer plano: mantiene la cámara y la detección con la app en segundo plano. */
          class DetectorService : LifecycleService() {

              companion object {
                  private const val CHANNEL = "detector"
                  private const val NOTIF_ID = 1
              }

              inner class LocalBinder : Binder() {
                  val service: DetectorService get() = this@DetectorService
              }

              private val binder = LocalBinder()
              lateinit var detector: Detector
                  private set

              private val exec = Executors.newSingleThreadExecutor()
              private var cameraProvider: ProcessCameraProvider? = null
              private var previewProvider: Preview.SurfaceProvider? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var started = false

              override fun onCreate() {
                  super.onCreate()
                  detector = Detector(this)
                  detector.load()
                  detector.onInside = { inside ->
                      updateNotification(if (inside) "DENTRO del auto" else "FUERA del auto")
                  }

                  val channel = NotificationChannel(CHANNEL, "Detector GTA", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)

                  val n = buildNotification("Vigilando la pantalla…")
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA)
                  } else {
                      startForeground(NOTIF_ID, n)
                  }

                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "gtamusic:detector").apply {
                      acquire(6 * 60 * 60 * 1000L)
                  }
              }

              override fun onBind(intent: Intent): IBinder? {
                  super.onBind(intent)
                  return binder
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  super.onStartCommand(intent, flags, startId)
                  if (!started) {
                      started = true
                      val future = ProcessCameraProvider.getInstance(this)
                      future.addListener({
                          cameraProvider = future.get()
                          rebind()
                      }, ContextCompat.getMainExecutor(this))
                  }
                  return START_NOT_STICKY
              }

              /** La pantalla de la app pide ver la vista previa. */
              fun attachPreview(sp: Preview.SurfaceProvider) {
                  previewProvider = sp
                  rebind()
              }

              fun detachPreview() {
                  previewProvider = null
                  rebind()
              }

              private fun rebind() {
                  val p = cameraProvider ?: return
                  try {
                      p.unbindAll()
                      val analysis = ImageAnalysis.Builder()
                          .setTargetAspectRatio(AspectRatio.RATIO_4_3)
                          .setTargetRotation(Surface.ROTATION_0)
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .build()
                          .also { it.setAnalyzer(exec) { img -> detector.process(img) } }
                      val sp = previewProvider
                      if (sp != null) {
                          val preview = Preview.Builder()
                              .setTargetAspectRatio(AspectRatio.RATIO_4_3)
                              .setTargetRotation(Surface.ROTATION_0)
                              .build()
                              .also { it.setSurfaceProvider(sp) }
                          p.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, analysis)
                      } else {
                          p.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, analysis)
                      }
                  } catch (e: Exception) {
                      detector.onStatus?.invoke("Error de cámara: ${e.message}")
                  }
              }

              private fun buildNotification(text: String): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle("GTA Música")
                      .setContentText(text)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .build()
              }

              private fun updateNotification(text: String) {
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                      .notify(NOTIF_ID, buildNotification(text))
              }

              override fun onDestroy() {
                  detector.onInside = null
                  detector.onStatus = null
                  cameraProvider?.unbindAll()
                  wakeLock?.let { if (it.isHeld) it.release() }
                  exec.shutdown()
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/example/gtamusic/MainActivity.kt <<'EOF'
          package com.example.gtamusic

          import android.Manifest
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.ServiceConnection
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.provider.Settings
          import android.view.KeyEvent
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SwitchCompat
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var overlay: RoiOverlayView
              private lateinit var statusText: TextView
              private lateinit var switchEnable: SwitchCompat
              private lateinit var seeks: List<SeekBar>

              private var service: DetectorService? = null
              private var bound = false
              private var updatingUi = false

              private val prefs by lazy { getSharedPreferences("cfg", MODE_PRIVATE) }

              private val notifLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { }

              private val permLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
                      if (ok) {
                          askNotificationPermission()
                          startAndBind()
                      } else {
                          toast("Sin permiso de cámara la app no funciona")
                      }
                  }

              private val conn = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, binder: IBinder?) {
                      val s = (binder as DetectorService.LocalBinder).service
                      service = s
                      val d = s.detector
                      d.onStatus = { t -> runOnUiThread { statusText.text = t } }
                      syncUi(d)
                      s.attachPreview(previewView.surfaceProvider)
                  }

                  override fun onServiceDisconnected(name: ComponentName?) {
                      service = null
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)

                  previewView = findViewById(R.id.previewView)
                  previewView.scaleType = PreviewView.ScaleType.FIT_CENTER
                  overlay = findViewById(R.id.roiOverlay)
                  statusText = findViewById(R.id.statusText)
                  switchEnable = findViewById(R.id.switchEnable)
                  seeks = listOf(
                      findViewById<SeekBar>(R.id.seekX), findViewById<SeekBar>(R.id.seekY),
                      findViewById<SeekBar>(R.id.seekW), findViewById<SeekBar>(R.id.seekH)
                  )
                  for (idx in 0..3) bindSeek(seeks[idx], idx)

                  findViewById<Button>(R.id.btnOut).setOnClickListener {
                      val d = det() ?: return@setOnClickListener
                      d.startRecording(1)
                      toast("Grabando FUERA 10 s: camina a pie, abre menús, párate junto al auto…")
                  }
                  findViewById<Button>(R.id.btnIn).setOnClickListener {
                      val d = det() ?: return@setOnClickListener
                      d.startRecording(2)
                      toast("Grabando DENTRO 10 s: conduce, frena, gira, cambia de cámara…")
                  }
                  findViewById<Button>(R.id.btnClear).setOnClickListener {
                      val d = det() ?: return@setOnClickListener
                      d.clearSamples()
                      syncUi(d)
                      toast("Capturas borradas")
                  }
                  findViewById<Button>(R.id.btnTest).setOnClickListener {
                      sendMediaKey(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE)
                  }
                  findViewById<Button>(R.id.btnBattery).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                  }
                  switchEnable.setOnCheckedChangeListener { _, checked ->
                      if (updatingUi) return@setOnCheckedChangeListener
                      val d = det() ?: return@setOnCheckedChangeListener
                      if (checked && !d.hasEnoughSamples()) {
                          updatingUi = true
                          switchEnable.isChecked = false
                          updatingUi = false
                          toast("Primero graba FUERA y DENTRO del auto")
                      } else {
                          d.setEnabled(checked)
                      }
                  }

                  if (hasCamera()) {
                      askNotificationPermission()
                  } else {
                      permLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              override fun onStart() {
                  super.onStart()
                  if (hasCamera()) startAndBind()
              }

              override fun onStop() {
                  super.onStop()
                  val keepRunning = service?.detector?.enabled == true
                  service?.detachPreview()
                  service?.detector?.onStatus = null
                  if (bound) {
                      unbindService(conn)
                      bound = false
                  }
                  service = null
                  // Si el control de Spotify está activo, el servicio sigue en segundo plano.
                  if (!keepRunning) stopService(Intent(this, DetectorService::class.java))
              }

              // ---------- Servicio ----------
              private fun hasCamera() =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) ==
                      PackageManager.PERMISSION_GRANTED

              private fun startAndBind() {
                  if (bound) return
                  val i = Intent(this, DetectorService::class.java)
                  ContextCompat.startForegroundService(this, i)
                  bound = bindService(i, conn, Context.BIND_AUTO_CREATE)
              }

              private fun askNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) !=
                      PackageManager.PERMISSION_GRANTED &&
                      !prefs.getBoolean("askedNotif", false)
                  ) {
                      prefs.edit().putBoolean("askedNotif", true).apply()
                      notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }
              }

              private fun det(): Detector? = service?.detector

              // ---------- Interfaz ----------
              private fun syncUi(d: Detector) {
                  updatingUi = true
                  val r = d.roi
                  for (idx in 0..3) seeks[idx].progress = (r[idx] * 100).toInt()
                  overlay.setRoi(r[0], r[1], r[2], r[3])
                  switchEnable.isChecked = d.enabled
                  updatingUi = false
                  statusText.text = d.calibStatus()
              }

              private fun bindSeek(sb: SeekBar, idx: Int) {
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (!fromUser) return
                          val d = det() ?: return
                          d.setRoiValue(idx, maxOf(p, if (idx >= 2) 5 else 0) / 100f)
                          syncUi(d)
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
              }

              private fun sendMediaKey(code: Int) {
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v3.${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "GTA Musica v3.${{ github.run_number }}" --notes "APK listo para instalar"
